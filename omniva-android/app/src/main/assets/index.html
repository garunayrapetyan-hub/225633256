<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Omniva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0b0c0e; --panel:#131417; --panel2:#0f1013; --line:#25272c; --fg:#f2f3f5; --mute:#9096a0;
  --teal:#2ee6c5; --orange:#f97316; --blue:#3b82f6; --amber:#f59e0b; --red:#ef4444; --green:#84cc16;
  --sans:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;margin:0;line-height:1.4;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#tm button{font:inherit;color:inherit}
.shell{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#tm .num{font-variant-numeric:tabular-nums}
#tm svg{display:block}
#tm :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#tm .top{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;flex-wrap:wrap}
#tm .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#1b3b4a,#0f1d26);display:grid;place-items:center;border:1px solid var(--line)}
#tm .crumb{color:var(--mute);display:flex;gap:8px;align-items:center}
#tm .crumb b{color:var(--fg);font-weight:600}
#tm .pills{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#tm .pill{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:500;font-size:12px;cursor:pointer}
#tm .pill:hover{border-color:#3a3d44}
#tm .pill[aria-pressed=true]{background:#1d2a2c;border-color:#2c5b55;color:var(--teal)}
#tm .saved{font:400 11px var(--mono);color:var(--mute);display:flex;align-items:center;gap:6px}
#tm .saved i{width:7px;height:7px;border-radius:50%;background:var(--teal)}
#tm .saved.bad i{background:var(--amber)}
#tm .btn{background:#1a1c20;border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-weight:600;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#tm .btn:hover{border-color:#3a3d44}
#tm .btn.pri{background:#12302d;border-color:#2c5b55;color:var(--teal)}
#tm .btn.danger{color:#ff8f8f;border-color:#5a2424;background:#1d1214}
#tm .btn.sm{padding:5px 10px;font-size:11px}
#tm .iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:#c9ccd3}
#tm .iconbtn:hover{border-color:#3a3d44;color:var(--fg)}
#tm .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
#tm button.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;min-width:0;text-align:left;cursor:pointer;width:100%}
#tm button.kpi:hover{border-color:#3a4a4c;background:#15171a}
#tm .ico{flex:none;width:38px;height:38px;border-radius:10px;background:#1c1e23;border:1px solid var(--line);display:grid;place-items:center;color:#cfd3da}
#tm .kpi .t{min-width:0;flex:1}
#tm .kpi .v{font-size:19px;font-weight:700;white-space:nowrap}
#tm .kpi .v small{font-size:10px;color:var(--mute);font-weight:500;margin-left:4px}
#tm .kpi .l{color:var(--mute);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tm .kpi .viz{flex:none}
#tm .kpi.red .v{color:#ff7b7b}
#tm .main{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
#tm .rail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
#tm .rail button{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:#a0a4ad;display:grid;place-items:center;cursor:pointer}
#tm .rail button:hover{background:#1c1e23;color:var(--fg)}
#tm .rail button.on{background:#12302d;color:var(--teal)}
#tm .rail hr{border:0;border-top:1px solid var(--line);margin:2px 4px;width:calc(100% - 8px)}
#tm .ov-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:12px;align-items:start}
#tm .stack{display:flex;flex-direction:column;gap:12px;min-width:0}
#tm .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
#tm .card h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
#tm .card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
#tm .sub{color:var(--mute);font-size:11px}
#tm .right>h2{font-size:15px;font-weight:600;margin:4px 0 12px}
#tm .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#tm .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;min-width:0}
#tm .pcard h4{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
#tm .pcard .sub{margin:4px 0 10px}
#tm .pcard .body{flex:1;display:flex;flex-direction:column;gap:2px}
#tm .more{margin-top:10px;display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--teal);font-weight:500;font-size:11px;cursor:pointer;width:100%}
#tm .more:hover{border-color:#2c5b55}
#tm .pcard.add{border-style:dashed;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer;color:var(--mute);min-height:160px;background:transparent}
#tm .pcard.add:hover{border-color:#2c5b55;color:var(--teal)}
#tm .bar{height:5px;border-radius:3px;background:#24262b;margin:2px 0 8px;overflow:hidden}
#tm .bar i{display:block;height:100%;border-radius:3px}
#tm .bar.big{height:7px;margin:10px 0 6px}
#tm .cta{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;background:linear-gradient(135deg,#12302d,#131417);border-color:#2c5b55}
#tm .btn.big{padding:11px 18px;font-size:13px}
#tm .trow{display:flex;align-items:center;gap:8px;padding:5px 0;min-width:0}
#tm .trow .st{flex:none;width:22px;height:22px;border:0;background:transparent;padding:2px;cursor:pointer;border-radius:50%;display:grid;place-items:center}
#tm .trow .st:hover{background:#1f2227}
#tm .trow .tt{flex:1;min-width:0;background:transparent;border:0;text-align:left;cursor:pointer;font-size:12px;color:#d9dce1;padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tm .trow .tt:hover{color:var(--teal)}
#tm .trow.done .tt{text-decoration:line-through;color:var(--mute)}
#tm .chip{flex:none;font-size:10px;font-weight:600;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:999px;padding:2px 8px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tm .due{flex:none;font:400 10px var(--mono);color:var(--mute)}
#tm .due.late{color:#ff7b7b}
#tm .empty{color:var(--mute);font-size:12px;padding:10px 0}
#tm .bed{display:flex;align-items:center;gap:14px}
#tm .bed .big{font-size:24px;font-weight:700}
#tm .bed input{margin-top:6px}
#tm .quote{font-size:13px;line-height:1.55}
#tm .quote .by{color:var(--mute);font-size:11px;margin-top:6px}
#tm .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tm .viewcard{padding:16px}
#tm .orbitwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
#tm .vis{width:100%;height:auto;max-height:78vh;background:radial-gradient(circle at 50% 50%,#101a1b 0,#0b0c0e 70%);border:1px solid var(--line);border-radius:12px}
#tm .vis [role=button]{cursor:pointer}
#tm .vis [role=button]:hover circle,#tm .vis [role=button]:hover ellipse{stroke:#fff;stroke-width:2}
#tm .vis text{font-family:var(--sans)}
#tm .legend{display:flex;flex-direction:column;gap:8px}
#tm .legend button{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
#tm .legend button:hover{border-color:#3a3d44}
#tm .legend i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
#tm .legend span.n{margin-left:auto;font:400 11px var(--mono);color:var(--mute)}
#tm .weekhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#tm .weekhead h3{margin:0 8px;font-size:14px}
#tm .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
#tm .day{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:150px;min-width:0}
#tm .day.today{border-color:#2c5b55}
#tm .day .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600;font-size:12px}
#tm .day .dh small{color:var(--mute);font-weight:500;margin-left:4px}
#tm .day .trow .tt{white-space:normal;font-size:11px}
#tm .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
#tm .foot{color:var(--mute);font:400 11px var(--mono);text-align:center;padding:6px}
#tm .ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#tm .modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(660px,100%);max-height:100%;overflow:auto;padding:20px}
#tm .modal h3{margin:0 40px 14px 0;font-size:16px}
#tm .modal h4{margin:16px 0 8px;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
#tm .x{position:absolute;top:12px;right:12px}
#tm .mh{display:flex;align-items:center;gap:10px;margin-right:40px}
#tm .inp{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:9px 11px;font:inherit;width:100%;min-width:0}
#tm .inp:focus{outline:2px solid var(--teal);outline-offset:0;border-color:transparent}
#tm .inp.title{font-weight:700;font-size:15px}
#tm textarea.inp{resize:vertical}
#tm .fl{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--mute);font-weight:600;margin-bottom:12px}
#tm .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#tm .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
#tm .seg button{flex:1;background:transparent;border:0;padding:8px;cursor:pointer;font-size:12px;font-weight:500;border-right:1px solid var(--line)}
#tm .seg button:last-child{border-right:0}
#tm .seg button.on{background:#12302d;color:var(--teal)}
#tm .addrow{display:flex;gap:8px;margin-top:10px}
#tm .mf{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
#tm .rowedit{display:grid;grid-template-columns:22px minmax(0,1fr) 128px 30px;gap:8px;align-items:center;padding:4px 0}
#tm .swatches{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#tm .sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
#tm .sw.on{border-color:#fff}
#tm .srow{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;text-align:left}
#tm .srow:hover{border-color:#3a3d44}
#tm .srow i{width:10px;height:10px;border-radius:50%;background:var(--c)}
#tm .srow .n{margin-left:auto;font:400 11px var(--mono);color:var(--mute)}
#tm .switch{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--fg);margin-bottom:12px}
#tm .switch input{width:18px;height:18px;accent-color:#2ee6c5}
#tm .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#1d2022;border:1px solid #33383c;border-radius:10px;padding:10px 14px;z-index:60;display:flex;gap:12px;align-items:center;font-size:12px}
#tm .toast button{background:transparent;border:0;color:var(--teal);font-weight:700;cursor:pointer}
@media (max-width:1180px){#tm .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
#tm .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
#tm .week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){#tm .ov-grid{grid-template-columns:minmax(0,1fr)}
#tm .orbitwrap{grid-template-columns:minmax(0,1fr)}
#tm .main{grid-template-columns:minmax(0,1fr)}
#tm .rail{flex-direction:row;position:static;overflow-x:auto}
#tm .rail hr{display:none}}
@media (max-width:620px){#tm .kpis,#tm .grid{grid-template-columns:minmax(0,1fr)}

[hidden]{display:none!important}
.gobtn{background:#12302d;border:1px solid #2c5b55;color:var(--teal);border-radius:10px;padding:9px 16px;font:600 12px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.gobtn:hover{border-color:var(--teal)}
/* ---- Omniva brand ---- */
.brand{display:flex;align-items:center;gap:10px}
.brand .wm{display:block;font:800 16px var(--sans);letter-spacing:.26em;background:linear-gradient(90deg,#eafffb,#8dbbff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.brand small{display:block;margin-top:5px;font:500 9px var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase;line-height:1}
body{background-image:radial-gradient(900px 420px at 92% -6%,#0d2b2e 0,transparent 65%),radial-gradient(800px 420px at -5% 105%,#111a36 0,transparent 60%);background-attachment:fixed}
#pg .top,#tm .top{border-color:#2a2d33;background-image:linear-gradient(90deg,rgba(46,230,197,.05),transparent 40%)}
#pg .kpi,#pg .pcard,#pg .card,#tm .card,#tm .pcard{background-image:linear-gradient(180deg,rgba(255,255,255,.025),transparent)}
#pg .pill[aria-pressed=true]{background:linear-gradient(135deg,#143a38,#14283f);border-color:#2f6f77;color:#e9fffb}
.gobtn{background:linear-gradient(135deg,#12302d,#14283f)}
/* ---- Omniva sub-dashboards ---- */
#pg .pv{display:flex;flex-direction:column;gap:12px;min-width:0}
#pg .rail hr{border:0;border-top:1px solid var(--line);margin:2px 4px;width:calc(100% - 8px)}
#pg .main.one{grid-template-columns:44px minmax(0,1fr)}
#pg .vgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;min-width:0;align-items:start}
#pg .c4{grid-column:span 4}#pg .c6{grid-column:span 6}#pg .c8{grid-column:span 8}
#pg .phd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
#pg .phd .sub{margin:3px 0 0}
#pg .tscroll{overflow-x:auto}
#pg .tbl{width:100%;border-collapse:collapse;font-size:12px}
#pg .tbl th{text-align:left;color:var(--mute);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
#pg .tbl td{padding:9px 8px;border-bottom:1px solid #1c1e23;vertical-align:middle}
#pg .tbl tr.dn td{opacity:.55}
#pg .mono{font-family:var(--mono);font-size:11px;color:#c9ccd3;white-space:nowrap}
#pg .lb{height:6px;background:#24262b;border-radius:3px;overflow:hidden;min-width:60px;flex:1}
#pg .lb i{display:block;height:100%;border-radius:3px}
#pg .lbw{display:flex;align-items:center;gap:8px;min-width:130px}
#pg .lbw span{min-width:34px;text-align:right;font-size:11px}
#pg .c2{font-size:10px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid;white-space:nowrap;display:inline-block}
#pg .c-ok{color:#5eead4;border-color:#1f5a52;background:#0e2a27}
#pg .c-warn{color:#fbbf24;border-color:#5a4410;background:#2a2008}
#pg .c-bad{color:#fca5a5;border-color:#6a2626;background:#2b1214}
#pg .c-info{color:#93c5fd;border-color:#274a80;background:#0f1d33}
#pg .c-mute{color:#a3a8b2;border-color:#33363c;background:#17181b}
#pg .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
#pg .d-ok{background:#2ee6c5}#pg .d-warn{background:#f59e0b}#pg .d-bad{background:#ef4444}#pg .d-info{background:#3b82f6}#pg .d-mute{background:#6b6f78}
#pg .hlist{display:flex;flex-direction:column;gap:12px}
#pg .hr2{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:12px}
#pg .hl{color:#c9ccd3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pg .alist{display:flex;flex-direction:column;gap:8px}
#pg .al{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
#pg .al.ack{opacity:.55}
#pg .at{font-size:12px;color:#e5e7eb}
#pg .btn2{background:#1a1c20;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:600 11px var(--sans);color:var(--fg);cursor:pointer;white-space:nowrap}
#pg .btn2:hover{border-color:#2c5b55;color:var(--teal)}
#pg .donutwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#pg .dleg{display:flex;flex-direction:column;gap:8px;font-size:12px;flex:1;min-width:130px}
#pg .dleg div{display:flex;align-items:center;gap:8px}
#pg .dleg i{width:9px;height:9px;border-radius:50%;flex:none}
#pg .dleg b{margin-left:auto}
#pg .lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-top:8px}
#pg .lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
#pg .kpi.red .v{color:#ff7b7b}
#pg .ssgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#pg .ss{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:inherit;font:inherit;min-width:0}
#pg .ss:hover{border-color:#3a3d44}
#pg .ss.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
#pg .ss.s-off{opacity:.65}
#pg .sr{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px}
#pg .sn{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pg .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
#pg .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#pg .dgrid div{display:flex;flex-direction:column;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
#pg .dgrid b{font-size:13px}
#pg .empty2{color:var(--mute);font-size:12px;padding:10px 0}
#pg .evl{display:flex;flex-direction:column;gap:12px}
#pg .evt{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start}
#pg .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#pg .fchip{background:transparent;border:1px solid var(--line);color:inherit;border-radius:999px;padding:5px 12px;font:500 11px var(--sans);cursor:pointer}
#pg .fchip:hover{border-color:#3a3d44}
#pg .fchip.on{background:#143a38;border-color:#2f6f77;color:var(--teal)}
#pg .gantt{display:grid;grid-template-columns:150px repeat(14,minmax(26px,1fr));min-width:560px;align-items:stretch}
#pg .gh{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mute);padding-bottom:6px}
#pg .gh b{color:var(--fg);font-size:11px}
#pg .gh.today b{color:var(--teal)}
#pg .gl{padding:8px 8px 8px 0;display:flex;flex-direction:column;border-top:1px solid #1c1e23;font-size:11px}
#pg .gl span{color:var(--mute);font-size:10px}
#pg .gc{border-top:1px solid #1c1e23;border-left:1px solid #1c1e23;min-height:42px}
#pg .gc.today{background:#0f2224}
#pg .gb{align-self:center;height:22px;border-radius:6px;margin:0 2px;z-index:1;font-size:10px;font-weight:700;color:#0b0c0e;display:flex;align-items:center;justify-content:center}
#pg .crews{display:flex;flex-direction:column;gap:8px}
#pg .crew{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
@media (max-width:1180px){#pg .c4{grid-column:span 6}#pg .c8,#pg .c6{grid-column:span 12}#pg .ssgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){#pg .main.one{grid-template-columns:minmax(0,1fr)}#pg .rail hr{display:none}}
@media (max-width:620px){#pg .c4,#pg .c6,#pg .c8{grid-column:span 12}#pg .ssgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#pg .hr2{grid-template-columns:90px 1fr auto}}

/* ---- Task Manager monthly calendar ---- */
#tm .cal{padding:18px}
#tm .calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
#tm .calhead h3{margin:0 8px;font-size:22px;font-weight:700;min-width:190px}
#tm .calstats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
#tm .cs{font-size:11px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--mute);background:var(--panel2)}
#tm .cs b{color:var(--fg);margin-right:5px;font-size:13px}
#tm .cs.late b{color:#ff7b7b}
#tm .mwd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
#tm .mwd div{text-align:center;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;padding:4px 0}
#tm .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
#tm .mcell{background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:120px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
#tm .mcell:hover{border-color:#3d5558;background:#12181b}
#tm .mcell.out{opacity:.4}
#tm .mcell.we{background:#0e0f12}
#tm .mcell.today{border-color:var(--teal);background:#0f2123;box-shadow:0 0 0 1px var(--teal) inset}
#tm .mtop{display:flex;justify-content:space-between;align-items:center}
#tm .mnum{background:transparent;border:0;font-weight:700;font-size:13px;width:28px;height:28px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--fg)}
#tm .mnum:hover{background:#1f2428}
#tm .mcell.today .mnum{background:var(--teal);color:#06241f}
#tm .mcount{font:500 10px var(--mono);color:var(--mute)}
#tm .chiprow{display:flex;flex-direction:column;gap:4px;min-width:0}
#tm .mchip{display:flex;align-items:center;gap:6px;width:100%;min-height:26px;padding:3px 8px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 16%,transparent);color:#eef0f3;font-size:11px;font-weight:500;cursor:pointer;text-align:left;min-width:0}
#tm .mchip:hover{background:color-mix(in srgb,var(--c) 32%,transparent)}
#tm .mchip i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
#tm .mchip .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#tm .mchip.done{opacity:.55}
#tm .mchip.done .tx{text-decoration:line-through}
#tm .mchip.doing i{box-shadow:0 0 0 2px #f59e0b88}
#tm .mchip.late{border-color:#ef4444;background:color-mix(in srgb,#ef4444 14%,transparent)}
#tm .mmore{background:transparent;border:0;color:var(--teal);font-size:11px;font-weight:600;text-align:left;cursor:pointer;padding:2px 4px}
#tm .legend2{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:11px;color:var(--mute)}
#tm .legend2 span{display:inline-flex;align-items:center;gap:6px}
#tm .legend2 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
@media (max-width:620px){
  #tm .mgrid,#tm .mwd{gap:3px}
  #tm .mcell{min-height:62px;padding:4px;gap:3px;border-radius:8px}
  #tm .chiprow{flex-direction:row;flex-wrap:wrap;gap:4px}
  #tm .mchip{min-height:0;width:auto;padding:0;border:0;background:none}
  #tm .mchip .tx{display:none}
  #tm .mchip i{width:11px;height:11px}
  #tm .mmore{display:none}
  #tm .mnum{width:24px;height:24px;font-size:12px}
  #tm .calhead h3{font-size:18px;min-width:0}
  #tm .calstats{margin-left:0}
}

</style>
</head>
<body>



<div class="shell" id="pg">
  <header class="top">
    <div class="brand"><svg width="36" height="36" viewBox="0 0 40 40" fill="none" aria-hidden="true"><defs><linearGradient id="omgA" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#2ee6c5"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><path d="M20 4A16 16 0 1 0 36 20" stroke="url(#omgA)" stroke-width="3" stroke-linecap="round"/><path d="M12.5 14.5L20 27l7.5-12.5" stroke="url(#omgA)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31.3" cy="8.7" r="3.2" fill="#f59e0b"/></svg><div><span class="wm">OMNIVA</span><small>Grid control</small></div></div>
    <div class="crumb"><b id="p-crumb">Generation</b></div>
    <span class="test">Sample data</span>
    <span class="live"><i></i><span id="clock">--:--:--</span></span>
    <nav class="pills" id="p-pills"></nav>
    <button class="gobtn" data-mode="tm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg>Task Manager →</button>
  </header>

  <div class="pv" id="pv-gen">
    <section class="kpis" id="p-kpis"></section>
    <div class="main">
      <aside class="rail" data-rail></aside>
      <div class="stack" id="left"></div>
      <section class="right">
        <h2>Real-Time Power System Operational Parameters</h2>
        <div class="grid" id="grid"></div>
      </section>
    </div>
  </div>
  <div class="pv" id="pv-tx" hidden></div>
  <div class="pv" id="pv-sub" hidden></div>
  <div class="pv" id="pv-mnt" hidden></div>
  <div class="foot">Omniva · all figures are sample data and refresh every few seconds.</div>
</div>




<div class="shell" id="tm" hidden>
  <header class="top">
    <div class="brand"><svg width="36" height="36" viewBox="0 0 40 40" fill="none" aria-hidden="true"><defs><linearGradient id="omgB" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#2ee6c5"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><path d="M20 4A16 16 0 1 0 36 20" stroke="url(#omgB)" stroke-width="3" stroke-linecap="round"/><path d="M12.5 14.5L20 27l7.5-12.5" stroke="url(#omgB)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31.3" cy="8.7" r="3.2" fill="#f59e0b"/></svg><div><span class="wm">OMNIVA</span><small>Task manager</small></div></div>
    <div class="crumb"><b id="crumb">Task Manager</b></div>
    <span class="saved" id="saved"><i></i><span id="savedTxt">Loading</span></span>
    <nav class="pills" id="pills" aria-label="Views"></nav>
    <button class="iconbtn" data-act="search" aria-label="Search" title="Search (press /)" id="btnSearch"></button>
    <button class="btn pri" data-act="addtask" id="btnAdd"></button>
  </header>

  <section class="kpis" id="kpis" aria-label="Summary"></section>

  <div class="main">
    <aside class="rail" id="rail" aria-label="Quick actions"></aside>
    <div id="view"></div>
  </div>
  <div class="foot" id="foot">Sample tasks are pre-filled. Edit or delete anything. Changes autosave in this browser.</div>
<div id="modalHost"></div>
<div id="toastHost"></div>
</div>


<script>

(function(){
  const PG=document.getElementById('pg');
  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const P = {
    bolt:'M13 2L4 14h7l-1 8 9-12h-7z',
    grid:'M4 4h16v16H4zM4 12h16M12 4v16',
    gauge:'M12 14l4-5M3 18a9 9 0 1118 0',
    plant:'M3 21V9l6 4V9l6 4V5h6v16z',
    leaf:'M5 19c0-9 5-14 15-14 0 10-5 15-14 15zM5 19l8-8',
    co2:'M7 8a4 4 0 100 8M17 8a4 4 0 110 8M11 12h2',
    shield:'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z',
    tower:'M12 3v18M7 21l5-18 5 18M8 11h8M9.5 16h5',
    sun:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',
    chart:'M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3',
    sliders:'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4',
    doc:'M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6',
    cube:'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5',
    flow:'M12 4v5M5 20v-4h14v4M12 9v7M12 9H6v4M12 9h6v4',
    fire:'M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z',
  };
  const ic = (n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
  const fmt=(v,d=0)=>Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  const rnd=(b,j)=>b+(Math.random()*2-1)*j;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  function ring(pct,color,size=44,sw=5){
    const r=(size-sw)/2,c=2*Math.PI*r;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#25272c" stroke-width="${sw}"/><circle data-ring cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s"/></svg>`;
  }
  function setRing(el,pct){const c=el.getAttribute('stroke-dasharray');el.setAttribute('stroke-dashoffset',c*(1-clamp(pct,0,100)/100))}

  // ---------- top bar & rail ----------
  // pills and side rails are handled by the Omniva views script
  setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('en-GB')},1000);$('clock').textContent=new Date().toLocaleTimeString('en-GB');

  // ---------- state ----------
  const S={gen:12350,cons:11870,load:96,plants:23,eff:92.4,ren:37,co2:13200,gsi:0.89,
    ren_total:4285,ren_cap:5600,solar:76.5,wind:70.0,hydro:920,bio:245,
    grid_gen:12435,ren_share:34.4,fos_share:65.6,gsi2:0.92,
    coal:5200,gas:2600};
  const hist=Array.from({length:30},(_,i)=>12100+Math.sin(i/3)*160+Math.random()*120);

  // ---------- KPI strip ----------
  const kpiDefs=[
    {i:'bolt',k:'gen',u:'MW',l:'Total Power Generation',viz:()=>`<svg id="spark" width="86" height="34"></svg>`},
    {i:'tower',k:'cons',u:'MW',l:'Total Power Consumption',cmp:true},
    {i:'gauge',k:'load',u:'%',l:'Grid Load',viz:()=>ring(96,'#3b82f6',44),ringKey:'load',ringColor:'#3b82f6'},
    {i:'plant',k:'plants',l:'Active Power Plants',custom:()=>`23 / 25`},
    {i:'shield',k:'eff',u:'%',d:1,l:'Transmission Efficiency',viz:()=>ring(92.4,'#3b82f6',44),ringKey:'eff',ringColor:'#3b82f6'},
    {i:'leaf',k:'ren',u:'%',l:'Renewable Energy Ratio',viz:()=>ring(37,'#f97316',44),ringKey:'ren'},
    {i:'co2',k:'co2',u:'ton CO₂',l:'Carbon Emission',viz:()=>`<svg id="co2bars" width="70" height="30"></svg>`},
    {i:'gauge',k:'gsi',u:'(out of 1)',d:2,l:'Grid Stability Index',viz:()=>ring(89,'#84cc16',44),ringKey:'gsi'},
  ];
  $('p-kpis').innerHTML=kpiDefs.map((d,n)=>`
    <div class="kpi"><div class="ico">${ic(d.i)}</div>
      <div class="t">
        ${d.cmp?`<div class="cmp"><div class="v num"><span data-k="${d.k}">0</span><small>${d.u}</small></div><div class="row"><span>${d.l}</span><span class="num">vs <span data-k="gen">0</span> MW</span></div><div class="bar" style="margin:0"><i data-bar="cons" style="background:var(--red);width:90%"></i></div></div>`
        :`<div class="v num">${d.custom?`<span id="plants">${d.custom()}</span>`:`<span data-k="${d.k}" data-d="${d.d||0}">0</span>`}${d.u?`<small>${d.u}</small>`:''}</div><div class="l">${d.l}</div>`}
      </div>${d.viz?`<div class="viz" data-kv="${n}">${d.viz()}</div>`:''}</div>`).join('');

  // ---------- left stack ----------
  const mrow=(label,key,unit,color,d=0)=>`<div class="m" style="--c:${color}"><span class="k">${label}</span><span class="val num"><span data-k="${key}" data-d="${d}">0</span><small>${unit}</small></span></div>`;
  $('left').innerHTML=`
    <div class="card"><div class="hd"><h3><span style="color:var(--teal)">${ic('leaf',16)}</span>Renewable Energy Generation</h3><span class="dots">···</span></div>
      ${mrow('Total Renewable Generation','ren_total','MW','#2ee6c5')}
      ${mrow('Installed Renewable Capacity','ren_cap','MW','#3b82f6')}
      ${mrow('Capacity Utilization','util','%','#3b82f6',1)}
      <div class="tiles">
        <div><span style="color:var(--amber)">${ic('sun',20)}</span><span><b class="num"><span data-k="solar" data-d="1">0</span></b>Solar Power Output</span></div>

function ring(pct,color,size=44,sw=5){
  const r=(size-sw)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#25272c" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(100,pct))/100)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function bars(data,color){
  const mx=Math.max(1,...data);
  return `<svg width="70" height="30" viewBox="0 0 70 30" aria-hidden="true">${data.map((v,i)=>`<rect x="${i*10}" y="${30-Math.max(2,v/mx*28)}" width="7" height="${Math.max(2,v/mx*28)}" rx="2" fill="${i===6?color:'#3a3d44'}"/>`).join('')}</svg>`;
}
function stIcon(s){
  if(s==='done')return '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#2ee6c5"/><path d="M5.5 9.2l2.4 2.4 4.6-5" stroke="#06241f" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(s==='doing')return '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.5" fill="none" stroke="#f59e0b" stroke-width="1.6"/><path d="M9 1.5a7.5 7.5 0 010 15z" fill="#f59e0b"/></svg>';
  return '<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.5" fill="none" stroke="#6b6f78" stroke-width="1.6"/></svg>';
}
function taskRow(t,o={}){
  const s=secBy(t.sec),late=isLate(t);
  return `<div class="trow ${t.status}">
    <button class="st" data-act="cycle" data-id="${t.id}" aria-label="Status: ${STL[t.status]}. Click to change" title="${STL[t.status]}. Click to change">${stIcon(t.status)}</button>
    <button class="tt" data-act="task" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button>
    ${o.noSec||!s?'':o.dot?`<span title="${esc(s.name)}" style="flex:none;width:8px;height:8px;border-radius:50%;background:${s.color}"></span>`:`<span class="chip" style="--c:${s.color}">${esc(s.name)}</span>`}
    ${t.due&&!o.noDue?`<span class="due ${late?'late':''}">${dueLabel(t.due)}</span>`:''}
  </div>`;
}

  if(focus.length<5)focus=[...focus,...s.open.filter(t=>!focus.includes(t))];

  const b=bedInfo(),q=st.quotes[st.qi%Math.max(1,st.quotes.length)]||{t:'Add your first quote.',a:''};
  const cards=st.sections.map(sec=>{
    const ts=st.tasks.filter(t=>t.sec===sec.id),d=ts.filter(t=>t.status==='done').length,open=ts.filter(t=>t.status!=='done'),pct=ts.length?d/ts.length*100:0;

        <div class="bed"><div>${ring(b.pct,'#a78bfa',56,6)}</div><div><div class="big num" data-bed>${b.txt}</div><div class="sub">${b.passed?'Time to wind down':'left until bedtime'}</div></div></div>

        <div class="row"><button class="btn pri big" data-act="view" data-v="overview">Open Task Manager →</button></div></div>`:''}
      <h2>${home?'Progress by section':'Sections'}</h2>

/* month */
function viewMonth(){
  const t0=today(),base=new Date();base.setDate(1);base.setMonth(base.getMonth()+monthOffset);
  const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),startDow=(first.getDay()+6)%7,daysIn=new Date(y,m+1,0).getDate();
  const weeks=Math.ceil((startDow+daysIn)/7);
  const title=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const inMonth=st.tasks.filter(t=>t.due&&t.due.slice(0,7)===y+'-'+pad(m+1));
  const mDone=inMonth.filter(t=>t.status==='done').length,mLate=inMonth.filter(isLate).length;
  const rank={doing:0,todo:1,done:2};
  let cells='';
  for(let i=0;i<weeks*7;i++){
    const d=new Date(y,m,1-startDow+i),ds=iso(d),ts=st.tasks.filter(t=>t.due===ds).sort((a,b)=>rank[a.status]-rank[b.status]);
    const shown=ts.slice(0,3),more=ts.length-shown.length;
    const chips=shown.map(t=>{const s=secBy(t.sec);return `<button class="mchip ${t.status}${isLate(t)?' late':''}" data-act="task" data-id="${t.id}" style="--c:${s?s.color:'#2ee6c5'}" title="${esc(t.title)} (${STL[t.status]})"><i></i><span class="tx">${esc(t.title)}</span></button>`}).join('');
    const lab=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
    cells+=`<div class="mcell${d.getMonth()!==m?' out':''}${i%7>=5?' we':''}${ds===t0?' today':''}" data-act="day" data-d="${ds}">
      <div class="mtop"><button class="mnum" data-act="day" data-d="${ds}" aria-label="${lab}, ${ts.length} task${ts.length===1?'':'s'}">${d.getDate()}</button>${ts.length?`<span class="mcount">${ts.length}</span>`:''}</div>
      <div class="chiprow">${chips}${more>0?`<button class="mmore" data-act="day" data-d="${ds}">+${more} more</button>`:''}</div></div>`;
  }
  const late=st.tasks.filter(isLate),nodate=st.tasks.filter(t=>!t.due&&t.status!=='done');
  return `<div class="card cal"><div class="calhead">
      <button class="iconbtn" data-act="mprev" aria-label="Previous month">${ic('left',16)}</button><h3>${title}</h3><button class="iconbtn" data-act="mnext" aria-label="Next month">${ic('right',16)}</button>
      <button class="btn sm" data-act="mtoday">Today</button>
      <div class="calstats"><span class="cs"><b>${inMonth.length}</b>tasks this month</span><span class="cs"><b>${mDone}</b>done</span><span class="cs late"><b>${mLate}</b>overdue</span></div></div>
    <div class="mwd">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="mgrid">${cells}</div>
    <div class="legend2">${st.sections.map(s=>`<span style="--c:${s.color}"><i></i>${esc(s.name)}</span>`).join('')}<span>Click a task to open it. Click a day to see all its tasks or add one.</span></div>
    <div class="two-col"><div class="day"><div class="dh"><span style="color:#ff7b7b">Overdue</span></div>${late.map(t=>taskRow(t)).join('')||'<div class="empty">Nothing overdue.</div>'}</div>
    <div class="day"><div class="dh"><span>No date</span></div>${nodate.map(t=>taskRow(t,{noDue:true})).join('')||'<div class="empty">Every open task has a date.</div>'}</div></div></div>`;
}

/* ---------- modals ---------- */

const swatches=(cur)=>`<div class="swatches">${COLORS.map(c=>`<button class="sw ${c===cur?'on':''}" style="--c:${c}" data-act="pickcolor" data-c="${c}" aria-label="Color ${c}"></button>`).join('')}</div>`;

    case 'task':{
      const nw=!!m.arg.new,t=nw?m.arg:taskBy(m.arg.id);
      if(!t){modal=null;return ''}

      return `<h3>${nw?'New task':'Task'}</h3>
        <label class="fl">Title<input class="inp" id="f-title" data-bind="t-title" value="${esc(t.title)}" placeholder="What needs to be done?" autofocus></label>
        <div class="two"><label class="fl">Section<select class="inp" id="f-sec" data-bind="t-sec">${secOptions(t.sec)}</select></label>

        <div class="fl">Status<div class="seg">${STAT.map(s=>`<button class="${t.status===s?'on':''}" data-act="setstatus" data-s="${s}">${STL[s]}</button>`).join('')}</div></div>
        <div class="mf">${nw?'<span></span>':`<button class="btn danger" data-act="del-task" data-id="${t.id}">${ic('trash',14)}Delete</button>`}

    }

        <div class="bar big"><i style="width:${ts.length?d/ts.length*100:0}%;background:${s.color}"></i></div><div class="sub">${d} of ${ts.length} done</div>
        <label class="fl" style="margin-top:14px">Notes<textarea class="inp" rows="3" data-bind="sec-notes" data-id="${s.id}">${esc(s.notes||'')}</textarea></label>
        <div class="fl" style="margin-bottom:0">Color${swatches(s.color)}</div>
        <h4>Tasks</h4>
        ${ts.map(t=>`<div class="rowedit"><button class="st" style="width:22px;height:22px;border:0;background:transparent;padding:2px;cursor:pointer" data-act="cycle" data-id="${t.id}" aria-label="Status: ${STL[t.status]}. Click to change">${stIcon(t.status)}</button>
          <input class="inp" data-bind="row-title" data-id="${t.id}" value="${esc(t.title)}" aria-label="Task title" style="${t.status==='done'?'text-decoration:line-through;color:#9096a0':''}">
          <input class="inp dd" type="date" data-bind="row-due" data-id="${t.id}" value="${esc(t.due||'')}" aria-label="Due date">
          <button class="iconbtn" style="width:30px;height:30px" data-act="del-task" data-id="${t.id}" data-quick="1" aria-label="Delete task">${ic('trash',14)}</button></div>`).join('')||'<div class="empty">No tasks yet.</div>'}
        <div class="addrow"><input class="inp" id="newTitle" placeholder="Add a task and press Enter"><button class="btn pri" data-act="rowadd" data-id="${s.id}">${ic('plus',14)}Add</button></div>
        <div class="mf"><button class="btn danger" data-act="del-section" data-id="${s.id}">${ic('trash',14)}Delete section</button><button class="btn pri" data-act="close">Done</button></div>`;
    }
    case 'sections':
      return `<h3>Sections</h3>${st.sections.map(s=>{const ts=st.tasks.filter(t=>t.sec===s.id);return `<button class="srow" style="--c:${s.color}" data-act="section" data-id="${s.id}"><i></i>${esc(s.name)}<span class="n">${ts.filter(t=>t.status==='done').length}/${ts.length}</span></button>`}).join('')||'<div class="empty">No sections yet.</div>'}
        <h4>New section</h4><input class="inp" id="newSecName" placeholder="Section name, for example Health"><div class="fl" style="margin:10px 0 0">Color${swatches(m.color)}</div>
        <div class="mf"><span></span><button class="btn pri" data-act="create-section">${ic('plus',14)}Add section</button></div>`;
    case 'list':{
      const s=stats(),L={done:['Completed tasks',s.done],open:['Open tasks',s.open],doing:['In progress',s.doing],late:['Overdue tasks',s.late],today:['Done today',s.doneToday]}[m.arg]||['Tasks',[]];
      return `<h3>${L[0]}</h3>${L[1].map(t=>taskRow(t)).join('')||'<div class="empty">Nothing here.</div>'}<div class="mf"><span></span><button class="btn pri" data-act="addtask">${ic('plus',14)}New task</button></div>`;
    }
    case 'day':{
      const ds=m.arg.d,ts=st.tasks.filter(t=>t.due===ds);
      const lab=new Date(ds+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      return `<h3>${lab}</h3>${ts.map(t=>taskRow(t,{noDue:true})).join('')||'<div class="empty">No tasks on this day.</div>'}<div class="mf"><span></span><button class="btn pri" data-act="addtask" data-due="${ds}">${ic('plus',14)}Add task</button></div>`;
    }
    case 'bed':{
      const b=bedInfo();
      return `<h3>Bedtime</h3><div class="bed"><div>${ring(b.pct,'#a78bfa',64,7)}</div><div><div class="big num" data-bed>${b.txt}</div><div class="sub">${b.passed?'Time to wind down':'left until bedtime'}</div></div></div>

    case 'search':
      return `<h3>Search</h3><input class="inp" id="q" placeholder="Search tasks and sections" autocomplete="off" autofocus><div id="qres" style="margin-top:12px">${searchResults('')}</div>`;

      return `<h3>Settings and backup</h3>

        <div class="mf"><button class="btn danger" data-act="reset">Reset to sample data</button><button class="btn pri" data-act="close">Done</button></div>`;
  }
  return '';
}
function searchResults(q){
  q=q.trim().toLowerCase();
  const ts=(q?st.tasks.filter(t=>t.title.toLowerCase().includes(q)):st.tasks.filter(t=>t.status!=='done').slice(0,8));
  const ss=q?st.sections.filter(s=>s.name.toLowerCase().includes(q)||(s.notes||'').toLowerCase().includes(q)):[];
  return (ss.map(s=>`<button class="srow" style="--c:${s.color}" data-act="section" data-id="${s.id}"><i></i>${esc(s.name)}<span class="n">section</span></button>`).join('')+ts.map(t=>taskRow(t)).join(''))||'<div class="empty">No matches.</div>';
}
function openModal(type,arg,extra){
  if(!modal)lastFocus=document.activeElement;
  modal={type,arg,...extra};renderModal(false);
}
function renderModal(keep){
  const h=$('#modalHost');
  if(!modal){h.innerHTML='';return}
  const prev=$('.modal',h),top=prev?prev.scrollTop:0,body=modalBody();
  if(!modal){h.innerHTML='';return}
  h.innerHTML=`<div class="ov" data-act="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(modal.type)}"><button class="iconbtn x" data-act="close" aria-label="Close">${ic('x',16)}</button>${body}</div></div>`;
  const md=$('.modal',h);
  if(keep){md.scrollTop=top}else{const f=$('[autofocus]',md);(f||$('.x',md)).focus({preventScroll:true})}
}
function closeModal(){modal=null;renderModal();if(lastFocus&&document.contains(lastFocus))try{lastFocus.focus({preventScroll:true})}catch(e){}}

/* ---------- actions ---------- */
function render(){const y=window.scrollY;renderChrome();renderKpis();renderView();if(Math.abs(window.scrollY-y)>1)window.scrollTo(0,y)}
function commit(modalToo){persist();render();if(modalToo&&modal)renderModal(true)}
function cycle(id){
  const t=taskBy(id);if(!t)return;
  const nx=STAT[(STAT.indexOf(t.status)+1)%3];
  t.status=nx;t.doneAt=nx==='done'?today():'';
  if(nx==='done')beep();
  commit(true);
}
function delTask(id,quick){
  const i=st.tasks.findIndex(t=>t.id===id);if(i<0)return;
  const [t]=st.tasks.splice(i,1);
  if(modal&&modal.type==='task')modal=null;
  commit(true);if(!modal)renderModal();
  toast('Task deleted',()=>{st.tasks.splice(Math.min(i,st.tasks.length),0,t);commit(true)});
}
function arm(el,label){
  if(el.dataset.armed)return true;
  el.dataset.armed='1';const old=el.innerHTML;el.textContent=label;
  setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.innerHTML=old}},3000);return false;
}
function kpiOpen(k){
  if(k==='hsk'){secBy('zh')?openModal('section','zh'):openModal('sections',null,{color:COLORS[0]});return}
  if(k==='bed'){openModal('bed');return}
  if(k==='sections'){openModal('sections',null,{color:COLORS[0]});return}
  openModal('list',k);
}
function createTask(){
  const m=modal,title=$('#f-title').value.trim();
  if(!title){$('#f-title').focus();return}

      }break;

      break}
    case 'create-section':{
      const inp=$('#newSecName'),v=inp.value.trim();if(!v){inp.focus();return}

      st.sections.push(s);commit();openModal('section',s.id);break}
    case 'mprev':monthOffset--;renderView();break;
    case 'mnext':monthOffset++;renderView();break;
    case 'mtoday':monthOffset=0;renderView();break;
    case 'day':openModal('day',{d:el.dataset.d});break;
    case 'nextq':st.qi=(st.qi+1)%Math.max(1,st.quotes.length);commit();break;
    case 'addquote':openModal('quote');break;
    case 'create-quote':{
      const t=$('#qt').value.trim();if(!t){$('#qt').focus();return}
      st.quotes.push({t,a:$('#qa').value.trim()});st.qi=st.quotes.length-1;modal=null;commit();renderModal();break}
    case 'bedpreset':st.bedtime=el.dataset.t;commit(true);break;
    case 'copybackup':{
      const ta=$('#backup');
      (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('Backup copied')).catch(()=>{ta.select();toast('Press Ctrl+C to copy the selected text')});break}
    case 'restore':{
      try{const o=JSON.parse($('#restore').value);if(!Array.isArray(o.sections)||!Array.isArray(o.tasks))throw 0;st=Object.assign(seed(),o);modal=null;commit();renderModal();toast('Backup restored')}

      break}
    case 'reset':
      if(arm(el,'Click again to reset everything')){st=seed();modal=null;commit();renderModal();toast('Sample data restored')}break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modal){closeModal();return}
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('svg [role=button]')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}

document.addEventListener('input',e=>{

    case 'bedtime-modal':if(t.value){st.bedtime=t.value;commit(true)}break;

});

  const kp=[KP('flow',fmt(flow),'MW','Total Line Flow',spark(T.hist,'#2ee6c5')),KP('gauge',fmt(load,1),'%','Average Line Loading',ring(load,'#3b82f6')),
    KP('alert',fmt(T.loss),'MW','Transmission Losses, 4.3%'),KP('tower','184 / 190','','Active Lines'),
    KP('flow','±'+fmt(T.vdev,2),'%','Voltage Deviation'),KP('shield',fmt(T.n1,1),'%','N-1 Security Margin',ring(T.n1/30*100,'#84cc16')),
    KP('plug','+'+fmt(T.net),'MW','Net Export on Interconnectors'),KP('alert',cong,'','Congested Lines',null,cong?'red':'')].join('');
  const rows=L.map(l=>{const p=l.f/l.cap*100,st=p>=95?['Congested','bad']:p>=85?['High','warn']:['Normal','ok'];
    return `<tr><td class="mono">${l.id}</td><td>${esc(l.n)}</td><td class="num">${l.kv}</td><td class="num">${fmt(l.f)}</td><td>${lb(p,loadColor(p))}</td><td>${chip(st[0],st[1])}</td></tr>`}).join('');
  const hrs=hours(24),xl=hrs.map((h,i)=>i%4===3?pad(h)+':00':'');
  const flowChart=lineChart({label:'Transmitted power over the last 24 hours',series:[{name:'Flow, MW',color:'#2ee6c5',data:T.hist,fill:1},{name:'Operating limit',color:'#f59e0b',data:T.hist.map(()=>3900),dash:1}],xl,ymin:2500,ymax:4000,legend:1});
  const vc=barChart({label:'Busbar voltage profile in per unit',groups:T.volts.map((v,i)=>({label:'B'+(i+1),vals:[v]})),colors:['#2ee6c5'],ymin:.94,ymax:1.06,dec:2,band:[.97,1.03],colorFn:v=>v<.97||v>1.03?'#f59e0b':'#2ee6c5',unit:' pu'});
  const ties=T.ties.map(([n,v])=>`<div class="hr2"><span class="hl">${n}</span><div class="lb"><i style="width:${Math.abs(v)/400*100}%;background:${v>0?'#3b82f6':'#a78bfa'}"></i></div><b class="num">${v>0?'Export':'Import'} ${fmt(Math.abs(v))} MW</b></div>`).join('');
  const al=T.alarms.map((a,i)=>`<div class="al ${T.acks[i]?'ack':''}"><i class="dot d-${a[1]}"></i><div><div class="at">${esc(a[0])}</div><div class="sub">${a[2]} min ago${T.acks[i]?' · acknowledged':''}</div></div><button class="btn2" data-ack="${i}">${T.acks[i]?'Undo':'Acknowledge'}</button></div>`).join('');
  const loss=donut([{v:58,color:'#3b82f6',label:'Conductor resistance',u:'%'},{v:21,color:'#2ee6c5',label:'Transformers',u:'%'},{v:14,color:'#f59e0b',label:'Corona',u:'%'},{v:7,color:'#a78bfa',label:'Other',u:'%'}],130,fmt(T.loss),'MW lost');
  return `<section class="kpis">${kp}</section><div class="main one"><aside class="rail" data-rail></aside><div class="vgrid">
    ${panel('c8','Line Loading','Live flow against thermal rating',`<div class="tscroll"><table class="tbl"><thead><tr><th>Line</th><th>Route</th><th>kV</th><th>Flow, MW</th><th>Loading</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`)}
    ${panel('c4','Loss Breakdown','Where the energy is lost',loss)}
    ${panel('c8','Transmitted Power, last 24 hours','Total corridor flow against the operating limit',flowChart)}
    ${panel('c4','Busbar Voltage Profile','Shaded band is 0.97 to 1.03 pu',vc)}
    ${panel('c6','Interconnectors','Cross-border and regional ties',`<div class="hlist">${ties}</div>`)}
    ${panel('c6','Active Alarms','Acknowledge an alarm to clear it from the queue',`<div class="alist">${al}</div>`)}
  </div></div>`;
}

/* ---------- Substations ---------- */
function buildSub(){
  const U=S.sub,list=U.list,sel=list[U.sel],on=list.filter(s=>s.st!=='off'),avg=on.reduce((a,s)=>a+s.load,0)/on.length;
  const kp=[KP('cube',`${on.length} / ${list.length}`,'','Substations Online',null,on.length<list.length?'':''),KP('box','28 / 30','','Transformers in Service'),
    KP('gauge',fmt(avg),'%','Average Transformer Load',ring(avg,'#3b82f6')),KP('therm',fmt(Math.max(...U.xf.map(x=>x.oil))+7),'°C','Hottest Oil Temperature'),
    KP('flow','126','','Breaker Operations, 24 h'),KP('alert','3','','Protection Trips, 24 h',null,'red'),
    KP('signal','99.2','%','SCADA Communication Health',ring(99.2,'#2ee6c5')),KP('battery','94','%','Station Battery Health',ring(94,'#84cc16'))].join('');
  const tiles=list.map((s,i)=>{const col=s.st==='off'?'#6b6f78':loadColor(s.load);
    return `<button class="ss ${i===U.sel?'sel':''} s-${s.st}" data-ss="${i}" aria-pressed="${i===U.sel}" aria-label="${esc(s.n)}, ${s.st==='off'?'offline':fmt(s.load)+' percent load'}"><div class="sr"><b>${s.id}</b><i class="dot d-${s.st==='ok'?'ok':s.st==='warn'?'warn':'mute'}"></i></div><div class="sn">${esc(s.n)}</div><div class="sr"><span class="sub">${s.kv} kV</span><span class="num">${s.st==='off'?'Offline':fmt(s.load)+'%'}</span></div><div class="lb"><i style="width:${s.load}%;background:${col}"></i></div></button>`}).join('');
  const mva=sel.load/100*sel.cap,nt=sel.cap>=500?3:2;
  const stc=sel.st==='ok'?chip('Normal','ok'):sel.st==='warn'?chip('Attention','warn'):chip('Offline','mute');
  const detail=`<div class="dhead"><div><b style="font-size:15px">${esc(sel.n)}</b><div class="sub">${sel.id} · ${sel.kv} kV</div></div>${stc}</div>
    <div class="dgrid"><div><span class="sub">Load</span><b class="num">${fmt(mva)} MVA</b></div><div><span class="sub">Capacity</span><b class="num">${sel.cap} MVA</b></div><div><span class="sub">Transformers</span><b class="num">${sel.st==='off'?0:nt} of ${nt}</b></div><div><span class="sub">Oil temperature</span><b class="num">${sel.st==='off'?'n/a':fmt(46+sel.load*.3)+' °C'}</b></div><div><span class="sub">Power factor</span><b class="num">${sel.st==='off'?'n/a':fmt(.94+sel.load/2000,2)}</b></div><div><span class="sub">Breakers closed</span><b class="num">${sel.st==='off'?'0 / 14':'13 / 14'}</b></div></div>
    <div class="sub" style="margin:10px 0 4px">Load over the last 24 hours</div>${sel.st==='off'?'<div class="empty2">No load. Station is isolated for inspection.</div>':spark(sel.hist,'#2ee6c5',300,56)}`;
  const xr=U.xf.map(x=>{const dga=x.oil>=74?['Alert','bad']:x.oil>=62?['Watch','warn']:['Normal','ok'];
    return `<tr><td class="mono">${x.id}</td><td>${x.ss}</td><td class="num">${x.mva}</td><td>${lb(x.load,loadColor(x.load))}</td><td class="num">${fmt(x.oil)} °C</td><td>${chip(dga[0],dga[1])}</td></tr>`}).join('');
  const top=[...on].sort((a,b)=>b.load-a.load).slice(0,8).map(s=>hrow(s.n,s.load,100,loadColor(s.load),fmt(s.load)+'%')).join('');
  const ev=U.ev.map(e=>{const d=new Date(Date.now()-e[0]*6e4);return `<div class="evt"><span class="mono">${pad(d.getHours())}:${pad(d.getMinutes())}</span><div><div class="at">${esc(e[1])}</div><div class="sub">${e[2]}</div></div></div>`}).join('');
  const br=donut([{v:412,color:'#2ee6c5',label:'Closed'},{v:38,color:'#3b82f6',label:'Open'},{v:3,color:'#ef4444',label:'Tripped'}],130,'453','breakers');
  return `<section class="kpis">${kp}</section><div class="main one"><aside class="rail" data-rail></aside><div class="vgrid">
    ${panel('c8','Substation Overview','Select a station to see its details',`<div class="ssgrid">${tiles}</div>`)}
    ${panel('c4','Selected Substation','',detail)}
    ${panel('c8','Transformer Health','Load, oil temperature and dissolved gas status',`<div class="tscroll"><table class="tbl"><thead><tr><th>Unit</th><th>Station</th><th>MVA</th><th>Load</th><th>Oil temp</th><th>Gas analysis</th></tr></thead><tbody>${xr}</tbody></table></div>`)}
    ${panel('c4','Breaker Status','All stations',br)}
    ${panel('c6','Load by Substation','Highest first',`<div class="hlist">${top}</div>`)}
    ${panel('c6','Recent Switching Events','Latest operations',`<div class="evl">${ev}</div>`)}
  </div></div>`;
}

/* ---------- Maintenance ---------- */
const wsLabel={open:'Open',progress:'In progress',done:'Done'};
function buildMnt(){
  const M=S.mnt,w=M.wos,open=w.filter(x=>x.s!=='done').length,late=w.filter(wDue).length;
  const kp=[KP('tool',28+open,'','Open Work Orders'),KP('alert',2+late,'','Overdue Work Orders',null,'red'),KP('cal','6','','Planned Outages, next 7 days'),
    KP('check','82','%','Preventive Maintenance Compliance',ring(82,'#2ee6c5')),KP('clock','1,840','h','Mean Time Between Failures'),KP('clock','6.3','h','Mean Time To Repair'),
    KP('shield','87','/100','Average Asset Health',ring(87,'#84cc16')),KP('box','93','%','Spare Parts Availability',ring(93,'#3b82f6'))].join('');
  const F=[['all','All'],['open','Open'],['progress','In progress'],['overdue','Overdue'],['done','Done']];
  const shown=w.filter(x=>M.filter==='all'||(M.filter==='overdue'?wDue(x):x.s===M.filter));
  const chips=`<div class="chips" role="group" aria-label="Filter work orders">${F.map(([k,l])=>`<button class="fchip ${M.filter===k?'on':''}" data-wf="${k}" aria-pressed="${M.filter===k}">${l}</button>`).join('')}</div>`;
  const rows=shown.map(x=>{const due=x.s==='done'?'Completed':x.due===0?'Today':x.due<0?`${-x.due} d late`:`in ${x.due} d`;
    const pc=x.p==='High'?'bad':x.p==='Medium'?'warn':'mute';const sc=x.s==='done'?['Done','ok']:wDue(x)?['Overdue','bad']:x.s==='progress'?['In progress','info']:['Open','mute'];
    const act=x.s==='open'?'Start':x.s==='progress'?'Complete':'Reopen';
    return `<tr class="${x.s==='done'?'dn':''}"><td class="mono">${x.id}</td><td><div>${esc(x.t)}</div><div class="sub">${esc(x.a)}</div></td><td>${chip(x.p,pc)}</td><td class="num">${due}</td><td>${chip(sc[0],sc[1])}</td><td><button class="btn2" data-wo="${x.id}">${act}</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty2">No work orders in this filter.</td></tr>';
  const wo=`${chips}<div class="tscroll"><table class="tbl"><thead><tr><th>ID</th><th>Task</th><th>Priority</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const health=[['Excellent',96,'#2ee6c5'],['Good',142,'#3b82f6'],['Fair',58,'#f59e0b'],['Poor',17,'#f97316'],['Critical',4,'#ef4444']].map(([l,v,c])=>hrow(l,v,150,c,v)).join('');
  const days=[...Array(14)].map((_,i)=>dayOf(i));
  let g=`<div class="gantt"><div class="gl0"></div>${days.map((d,i)=>`<div class="gh ${i===0?'today':''}" style="grid-row:1;grid-column:${i+2}"><b>${d.getDate()}</b><span>${'SMTWTFS'[d.getDay()]}</span></div>`).join('')}`;
  M.out.forEach((o,r)=>{const row=r+2;
    g+=`<div class="gl" style="grid-row:${row};grid-column:1"><b>${esc(o.t)}</b><span>${esc(o.a)}</span></div>`;
    days.forEach((_,i)=>{g+=`<div class="gc ${i===0?'today':''}" style="grid-row:${row};grid-column:${i+2}"></div>`});
    g+=`<div class="gb" style="grid-row:${row};grid-column:${o.s+2}/span ${o.n};background:${o.c}" title="${esc(o.t)}, ${o.n} day${o.n>1?'s':''}">${o.n} d</div>`});
  g+='</div>';
  const crews=M.crews.map(c=>`<div class="crew"><div class="ico" style="width:32px;height:32px">${ic('users',15)}</div><div><b>${c[0]}</b><div class="sub">${c[1]}</div></div>${chip(c[2],c[3])}</div>`).join('');
  const wk=['W-7','W-6','W-5','W-4','W-3','W-2','W-1','Now'],done=barChart({label:'Work orders created and completed per week',groups:wk.map((l,i)=>({label:l,vals:[[14,12,15,11,13,16,12,14][i],[12,13,11,12,12,14,13,9][i]]})),colors:['#3b82f6','#2ee6c5'],ymin:0,ymax:20,legend:['Created','Completed'],h:190});
  const mo=['May','Jun','Jul','Aug','Sep','Oct'],spend=barChart({label:'Maintenance spend, planned and actual, in thousand dollars',groups:mo.map((l,i)=>({label:l,vals:[[48,52,50,55,58,54][i],[45,57,49,61,56,52][i]]})),colors:['#6b6f78','#f59e0b'],ymin:0,ymax:80,legend:['Planned, $k','Actual, $k'],unit:'k',h:190});
  const att=[['Transformer T3 · SS-11',46],['Breaker CB-088 · SS-11',52],['Conductor TL-304',58],['Relay R-221 · SS-09',61],['Battery B-06 · SS-02',63]].map(([l,v])=>hrow(l,v,100,v<50?'#ef4444':v<60?'#f97316':'#f59e0b',v)).join('');
  return `<section class="kpis">${kp}</section><div class="main one"><aside class="rail" data-rail></aside><div class="vgrid">
    ${panel('c8','Work Orders','Use the buttons to move a job to the next stage',wo)}
    ${panel('c4','Asset Health','Number of assets by condition',`<div class="hlist">${health}</div>`)}
    ${panel('c8','Outage Schedule','Next 14 days',`<div class="tscroll">${g}</div>`)}
    ${panel('c4','Crew Availability','Field teams right now',`<div class="crews">${crews}</div>`)}
    ${panel('c4','Work Orders per Week','Created and completed',done)}
    ${panel('c4','Maintenance Spend','Planned and actual by month',spend)}
    ${panel('c4','Assets Needing Attention','Lowest health score first',`<div class="hlist">${att}</div>`)}
  </div></div>`;
}

/* ---------- view switching ---------- */
const TITLES={gen:'Generation',tx:'Transmission',sub:'Substations',mnt:'Maintenance'};
const BUILD={tx:buildTx,sub:buildSub,mnt:buildMnt};
const RAIL=[['gen','grid'],['tx','tower'],['sub','cube'],['mnt','tool']];
let cur='gen';
const railHTML=k=>RAIL.map(([v,i])=>`<button class="${v===k?'on':''}" data-pv="${v}" aria-label="${TITLES[v]}" title="${TITLES[v]}">${ic(i)}</button>`).join('')+`<hr><button data-mode="tm" aria-label="Task Manager" title="Task Manager">${ic('layers')}</button>`;
const pillsHTML=k=>Object.keys(TITLES).map(v=>`<button class="pill" data-pv="${v}" aria-pressed="${v===k}">${TITLES[v]}</button>`).join('');
function keep(fn){
  const a=document.activeElement,y=window.scrollY;let sel=null;
  if(a&&PG.contains(a)&&a.dataset){const k=['ss','ack','wf','wo'].find(x=>a.dataset[x]!==undefined);if(k)sel=`[data-${k}="${a.dataset[k]}"]`}
  fn();if(sel){const n=q(sel);if(n)n.focus({preventScroll:true})}
  if(Math.abs(window.scrollY-y)>1)window.scrollTo(0,y);
}
function renderView(k){
  keep(()=>{q('#pv-'+k).innerHTML=BUILD[k]();qa('#pv-'+k+' [data-rail]').forEach(r=>{r.innerHTML=railHTML(k)})});
}
function setView(k){
  cur=k;
  qa('.pv').forEach(el=>{el.hidden=el.id!=='pv-'+k});
  if(k!=='gen')renderView(k);
  q('#p-crumb').textContent=TITLES[k];
  q('#p-pills').innerHTML=pillsHTML(k);
  qa('#pv-gen [data-rail]').forEach(r=>{r.innerHTML=railHTML(k)});
  window.scrollTo(0,0);
}
function advance(id){
  const w=S.mnt.wos.find(x=>x.id===id);if(!w)return;
  w.s=w.s==='open'?'progress':w.s==='progress'?'done':'open';
}
PG.addEventListener('click',e=>{
  const el=e.target.closest('[data-pv],[data-ss],[data-ack],[data-wf],[data-wo]');if(!el)return;
  const d=el.dataset;
  if(d.pv){setView(d.pv);return}
  if(d.ss!==undefined){S.sub.sel=+d.ss;renderView('sub');return}
  if(d.ack!==undefined){S.tx.acks[d.ack]=!S.tx.acks[d.ack];renderView('tx');return}
  if(d.wf){S.mnt.filter=d.wf;renderView('mnt');return}
  if(d.wo){advance(d.wo);renderView('mnt')}
});
function jitter(){
  const T=S.tx;
  T.lines.forEach(l=>{l.f=clamp(l.f+rnd(0,l.cap*.012),l.cap*.45,l.cap*1.0)});
  T.hist.push(T.lines.reduce((a,l)=>a+l.f,0)*0.95+rnd(0,40));T.hist.shift();
  T.volts=T.volts.map(v=>clamp(v+rnd(0,.003),.95,1.05));T.loss=clamp(T.loss+rnd(0,6),510,560);T.net=clamp(T.net+rnd(0,10),600,680);T.vdev=clamp(T.vdev+rnd(0,.02),.6,1);
  S.sub.list.forEach(s=>{if(s.st==='off')return;s.load=clamp(s.load+rnd(0,1.5),35,96);s.hist.push(s.load);s.hist.shift()});
  S.sub.xf.forEach(x=>{x.load=clamp(x.load+rnd(0,1.2),45,95);x.oil=clamp(x.oil+rnd(0,.6),50,80)});
}
setInterval(()=>{if(cur==='tx'||cur==='sub'){jitter();renderView(cur)}else{jitter()}},3000);
setView('gen');
})();

</script>
<script>
window.__mode=function(m){document.getElementById('pg').hidden=m!=='pg';document.getElementById('tm').hidden=m!=='tm';window.scrollTo(0,0)};
document.addEventListener('click',function(e){var b=e.target.closest('[data-mode]');if(b)window.__mode(b.dataset.mode)});
</script>
<script>
/* Android back button support */
window.__omnivaBack=function(){
  var x=document.querySelector('#modalHost .x'); if(x){x.click();return true}
  if(!document.getElementById('tm').hidden){window.__mode('pg');return true}
  var cur=document.querySelector('#p-pills .pill[aria-pressed="true"]');
  if(cur&&cur.dataset.pv!=='gen'){var g=document.querySelector('#p-pills .pill[data-pv="gen"]');if(g){g.click();return true}}
  return false;
};
</script>
</body>
